# Metabase over HTTPS. Change stats.example.fi to your address, then:
#   sudo cp scripts/metabase/nginx.conf /etc/nginx/sites-available/metabase
#   sudo ln -s /etc/nginx/sites-available/metabase /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stats.example.fi
server {
    listen 80;
    server_name stats.example.fi;

    location / {
        # To allow only some networks (e.g. LUT's or a VPN's), uncomment:
        # allow 192.0.2.0/24;
        # deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
