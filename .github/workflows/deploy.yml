name: Deploy with Coolify

# A push to testing deploys staging, and one to main (a merged pull request)
# deploys production. Coolify builds the release on the server and only moves
# the traffic to it once its health check passes (DEPLOYMENT.md).
#
# Needs the repository secret COOLIFY_TOKEN: an API token from Coolify
# (Keys & Tokens › API Tokens) with the "deploy" and "read" permissions.

on:
  push:
    branches: [testing, main]
  # Also from the Actions tab: Run workflow, choosing the branch
  workflow_dispatch:

# One deploy per branch at a time; a newer push waits for the one before it
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy
      env:
        COOLIFY_URL: https://deploy.kyyti.net
        COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -eo pipefail

        # The apps' UUIDs in Coolify (shown in each app's URL there)
        case "$BRANCH" in
          testing) app=nfumlq45lf5vteyh6htfbmee; environment=staging ;;
          main) app=fx0gzv3di7uxvwla74ocpxkz; environment=production ;;
          *) echo "::error::$BRANCH is not deployed anywhere (only testing and main are)."; exit 1 ;;
        esac
        if [ -z "$COOLIFY_TOKEN" ]; then
          echo "::error::The COOLIFY_TOKEN secret is missing. Create an API token in Coolify (Keys & Tokens › API Tokens, with deploy and read) and add it as a repository secret."
          exit 1
        fi

        api() {
          curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" "$@"
        }

        deployment=$(api -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$app" | jq -r '.deployments[0].deployment_uuid')
        echo "Deploying $BRANCH to $environment: $COOLIFY_URL (deployment $deployment)"

        # Wait for it, so that a failed deploy fails this workflow too. The
        # release before it keeps serving if it fails.
        for _ in $(seq 120); do
          status=$(api "$COOLIFY_URL/api/v1/deployments/$deployment" | jq -r '.status')
          case "$status" in
            finished) echo "Deployed to $environment."; exit 0 ;;
            failed|cancelled*) echo "::error::The deploy $status. Its log is in Coolify: the app's Deployments."; exit 1 ;;
          esac
          sleep 15
        done
        echo "::error::The deploy did not finish in 30 minutes. See the app's Deployments in Coolify."
        exit 1
