{% extends "app.html" %}

{% load widget_tweaks %}
{% load i18n %}
{% load static %}

{% block title %}{% trans "Search" context "Page title" %}{% endblock %}
{% block content %}
{{ campuses|json_script:"campus-data" }}

<script>
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
        key: "{{ GOOGLE_MAPS_API_KEY }}"
    });
    
    window.onload = function() {
        autocomplete_init("div-autocomplete-start", "start", "From");
        destination_init("div-autocomplete-destination", "campus-data", "To", "{% trans "Other destination" %}");
    };
</script>

<section class="flex flex-col pt-5 lg:pt-20 h-screen mx-auto overflow-scroll scrollbar-hide">
    <form id="search-form" class="flex lg:sticky lg:top-0 z-10 justify-center mx-2" action="/app/search/" method="post">
        {% csrf_token %}
        
        <div class="card border-solid border-2 border-primary bg-base-100 shadow-sm lg:w-200 z-10 justify-center">
            <div class="card-body">
                <div class="flex flex-wrap pb-4 place-content-center gap-4">
                    <div class="badge shadow-md py-5 px-2">
                        <label class="label">
                            <input name="offer" type="checkbox" class="checkbox before:delay-0 before:duration-100" />
                            {% trans "Offer car ride" %}
                        </label>
                    </div>
                    <div class="badge shadow-md py-5 px-2">
                        <label class="label">
                            <input name="request" type="checkbox" class="checkbox before:delay-0 before:duration-100" />
                            {% trans "Request car ride" %}
                        </label>
                    </div>
                    <div class="badge shadow-md py-5 px-2">
                        <label class="label">
                            <input name="other" type="checkbox" class="checkbox before:delay-0 before:duration-100" />
                            {% trans "Train, bus, taxi, other" %}
                        </label>
                    </div>
                </div>
                <div class="grid md:grid-cols-7 grid-cols-2 gap-4 h-full">
                    <div id="div-autocomplete-start" class="col-span-2 w-full skeleton rounded-field"></div>
                    <div id="div-autocomplete-destination" class="col-span-2 w-full skeleton rounded-field"></div>
                    <!-- <input type="search" name="start" placeholder="{% trans "From" %}" class="input col-span-2 w-full" id="id_search_query">
                    <input type="search" name="destination" placeholder="{% trans "To" %}" class="input col-span-2 w-full" id="id_search_query"> -->
                    <input type="datetime-local" placeholder="{% trans "Date" %}" class="input col-span-2 w-full">
                    <input class="btn btn-primary md:col-span-1 col-span-2" type="submit" value="{% trans "Search" %}">
                </div>

            </div>
        </div>
    </form>
    <div id="search-results" aria-live="polite" class="flex flex-wrap 2xl:w-380 xl:w-300 md:w-200 mb-15 md:mb-0 lg:pb-2 pb-15 pt-5 col-span-1 xl:px-0 justify-center">
        {% include "search_results.html" %}
    </div>
</section>

<template id="search-error">
    <p class="basis-full text-center text-error">{% trans "Search failed, please try again." %}</p>
</template>

<script>
    // Search without reloading the page: the form is posted with fetch and
    // the server returns only the results (search_results.html).
    (function() {
        const form = document.getElementById("search-form");
        const results = document.getElementById("search-results");
        const scroller = results.closest("section");
        let lastSearch = null;
        let controller = null;

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            let data;
            if (event.submitter && event.submitter.name === "page" && lastSearch) {
                // Changing page keeps the filters of the last search,
                // even if the form has been edited since.
                data = new FormData();
                for (const [key, value] of lastSearch) {
                    data.append(key, value);
                }
                data.set("page", event.submitter.value);
            } else {
                data = new FormData(form);
                lastSearch = [...data.entries()];
            }

            // Only the latest search is shown
            if (controller) {
                controller.abort();
            }
            controller = new AbortController();
            results.setAttribute("aria-busy", "true");
            results.classList.add("opacity-50");

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: data,
                    headers: { "X-Requested-With": "XMLHttpRequest" },
                    signal: controller.signal,
                });
                if (response.redirected) {
                    // e.g. the session expired and we were sent to the login page
                    window.location.href = response.url;
                    return;
                }
                if (!response.ok) {
                    throw new Error(`Search failed: ${response.status}`);
                }
                results.innerHTML = await response.text();
                scroller.scrollTo({ top: 0, behavior: "smooth" });
            } catch (error) {
                if (error.name === "AbortError") {
                    return;
                }
                console.error(error);
                results.replaceChildren(document.getElementById("search-error").content.cloneNode(true));
            } finally {
                results.removeAttribute("aria-busy");
                results.classList.remove("opacity-50");
            }
        });
    })();
</script>

{% endblock %}
