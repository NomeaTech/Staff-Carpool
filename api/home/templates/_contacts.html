{% load i18n %}{% comment %}
  Contact details from accounts.privacy.contact_details(), only for ride partners.
{% endcomment %}
<ul class="grid gap-1 text-sm">
  {% for kind, value, link in contacts %}
  <li>
    <a href="{{ link }}" class="link link-hover inline-flex items-center gap-2 break-all">
      {% include "_icon.html" with name=kind class="size-4 text-primary" %}{{ value }}
    </a>
  </li>
  {% endfor %}
</ul>
